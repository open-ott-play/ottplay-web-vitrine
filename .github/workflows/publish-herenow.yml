name: Publish here.now
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Verified ottplay-foss stable tag vX.Y.Z
        required: true
        type: string
concurrency:
  group: ottplay-web-vitrine-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: Checkout exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Require protected production approval
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/require-production.py
    - name: Require publishing credentials
      env:
        HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
      run: ': "${HERENOW_API_KEY:?Configure production environment credentials before publishing}"'
    - name: Download and verify stable release bytes
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: python3 scripts/prepare-dist.py "$RELEASE_TAG"
    - name: Checkout pinned publishing dependency
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: heredotnow/skill
        ref: 8cf033ed53b82c0c67b16359c8c431f99e111d04
        path: .ci-tools/herenow
        persist-credentials: false
    - name: Publish verified distribution
      env:
        HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
        HERENOW_WORKSPACE: ottplay
        HERENOW_SITE_SLUG: liminal-sketch-vv8r
        HERENOW_PUBLISH_SCRIPT: ${{ github.workspace }}/.ci-tools/herenow/here-now/scripts/publish.sh
        OVERWRITE: '1'
        SPA: '1'
      run: bash scripts/publish-herenow.sh ./dist
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      }}
    environment: production
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
