apiVersion: apps/v1
kind: Deployment
metadata:
  name: ottplay-epg
  namespace: synology-apps
spec:
  replicas: 1
  # Matching stores channel IDs in memory; keep lookups and reads on one pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ottplay-epg
  template:
    metadata:
      labels:
        app: ottplay-epg
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: syn
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: epg
          # Unmodified linux/amd64 OCI image from the v1.1.46 stable release.
          image: 192.168.167.25:5050/ottplay-epg@sha256:898c494ac8be47e9e629ebd5704487c2daf78f1067b104e5525f996a4b112ded
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EPG_URLS
              value: http://epg.it999.ru/epg2.xml.gz
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ottplay-epg
  namespace: synology-apps
spec:
  selector:
    app: ottplay-epg
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ottplay-epg-egress
  namespace: cloudflared
spec:
  podSelector:
    matchLabels:
      app: cloudflared
      tunnel: h7
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: synology-apps
          podSelector:
            matchLabels:
              app: ottplay-epg
      ports:
        - protocol: TCP
          port: 8080
